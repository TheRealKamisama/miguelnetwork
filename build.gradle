import groovy.json.JsonSlurper

import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'

    // https://www.curseforge.com/minecraft/mc-mods/zstdnet/files
    modImplementation "curse.maven:zstdnet-1506928:8752125"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Uncomment the lines below if you wish to configure mixin. The mixin file should be named modid.mixins.json.
/*
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}
*/

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

sourceSets.main.resources.exclude 'native/**'

def wstunnelManifestFile = file('src/main/resources/META-INF/miguelnetwork/wstunnel-manifest.json')
def wstunnelManifest = new JsonSlurper().parse(wstunnelManifestFile)
def wstunnelOutputDirectory = layout.buildDirectory.dir('generated/wstunnelResources')
def wstunnelArchiveOverride = providers.gradleProperty('wstunnelArchiveDir')

def sha256 = { InputStream input ->
    def digest = MessageDigest.getInstance('SHA-256')
    try (input) {
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = input.read(buffer)) >= 0) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

def prepareWstunnel = tasks.register('prepareWstunnel') {
    group = 'build'
    description = 'Downloads, verifies, and stages the pinned upstream wstunnel binaries.'

    inputs.file(wstunnelManifestFile)
    inputs.property('wstunnelVersion', wstunnelManifest.version)
    inputs.property('wstunnelPlatforms', wstunnelManifest.platforms.toString())
    outputs.dir(wstunnelOutputDirectory)

    doLast {
        File outputDirectory = wstunnelOutputDirectory.get().asFile
        delete(outputDirectory)

        File cacheDirectory = new File(
                gradle.gradleUserHomeDir,
                "caches/miguelnetwork/wstunnel/${wstunnelManifest.version}"
        )
        cacheDirectory.mkdirs()

        wstunnelManifest.platforms.each { String platformName, Map metadata ->
            File archiveFile
            if (wstunnelArchiveOverride.isPresent()) {
                archiveFile = new File(wstunnelArchiveOverride.get(), metadata.archive as String)
                if (!archiveFile.isFile()) {
                    throw new GradleException("Missing wstunnel archive in -PwstunnelArchiveDir: ${archiveFile}")
                }
            } else {
                archiveFile = new File(cacheDirectory, metadata.archive as String)
                if (!archiveFile.isFile()
                        || sha256(new FileInputStream(archiveFile)) != metadata.archiveSha256) {
                    File temporaryFile = new File(cacheDirectory, "${metadata.archive}.tmp")
                    temporaryFile.delete()
                    String downloadUrl = "${wstunnelManifest.upstream}/releases/download/v${wstunnelManifest.version}/${metadata.archive}"
                    logger.lifecycle("Downloading ${downloadUrl}")
                    def connection = uri(downloadUrl).toURL().openConnection()
                    connection.connectTimeout = 30_000
                    connection.readTimeout = 120_000
                    try (InputStream input = connection.inputStream) {
                        Files.copy(input, temporaryFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
                    }
                    String temporaryHash = sha256(new FileInputStream(temporaryFile))
                    if (temporaryHash != metadata.archiveSha256) {
                        temporaryFile.delete()
                        throw new GradleException("wstunnel archive SHA-256 mismatch for ${metadata.archive}: "
                                + "expected ${metadata.archiveSha256}, got ${temporaryHash}")
                    }
                    Files.move(temporaryFile.toPath(), archiveFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
            }

            String archiveHash = sha256(new FileInputStream(archiveFile))
            if (archiveHash != metadata.archiveSha256) {
                throw new GradleException("wstunnel archive SHA-256 mismatch for ${metadata.archive}: "
                        + "expected ${metadata.archiveSha256}, got ${archiveHash}")
            }

            String executableName = platformName.startsWith('windows-') ? 'wstunnel.exe' : 'wstunnel'
            Set<File> candidates = tarTree(resources.gzip(archiveFile)).matching {
                include executableName
                include "**/${executableName}"
            }.files
            if (candidates.size() != 1) {
                throw new GradleException("Expected one ${executableName} in ${metadata.archive}, found ${candidates.size()}")
            }

            File executable = candidates.first()
            String executableHash = sha256(new FileInputStream(executable))
            if (executableHash != metadata.binarySha256) {
                throw new GradleException("wstunnel binary SHA-256 mismatch for ${platformName}: "
                        + "expected ${metadata.binarySha256}, got ${executableHash}")
            }

            File target = new File(outputDirectory, "native/${platformName}/${executableName}")
            target.parentFile.mkdirs()
            Files.copy(executable.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn prepareWstunnel

    from(wstunnelOutputDirectory)

    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-MiguelNetwork-Apache-2.0.txt' }
    }
    from('NOTICE') {
        into 'META-INF'
        rename { 'NOTICE-MiguelNetwork.txt' }
    }
}

def verifyDistribution = tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Verifies native binaries and required notices in the distributable Mod JAR.'
    dependsOn tasks.named('jar')

    doLast {
        File jarFile = tasks.named('jar').get().archiveFile.get().asFile
        new ZipFile(jarFile).withCloseable { ZipFile zip ->
            wstunnelManifest.platforms.each { String platformName, Map metadata ->
                String executableName = platformName.startsWith('windows-') ? 'wstunnel.exe' : 'wstunnel'
                String entryName = "native/${platformName}/${executableName}"
                def entry = zip.getEntry(entryName)
                if (entry == null) {
                    throw new GradleException("Distribution is missing ${entryName}")
                }
                String actualHash = sha256(zip.getInputStream(entry))
                if (actualHash != metadata.binarySha256) {
                    throw new GradleException("Distribution SHA-256 mismatch for ${entryName}: "
                            + "expected ${metadata.binarySha256}, got ${actualHash}")
                }
            }

            [
                    'META-INF/LICENSE-MiguelNetwork-Apache-2.0.txt',
                    'META-INF/NOTICE-MiguelNetwork.txt',
                    'META-INF/licenses/wstunnel-BSD-3-Clause.txt',
                    'THIRD_PARTY_NOTICES.md',
                    'META-INF/miguelnetwork/wstunnel-manifest.json'
            ].each { String entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("Distribution is missing required legal or provenance file ${entryName}")
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyDistribution
}

tasks.register('verifyReleaseVersion') {
    group = 'verification'
    description = 'Checks that -PreleaseVersion matches the project version.'
    def releaseVersion = providers.gradleProperty('releaseVersion')
    doLast {
        if (!releaseVersion.isPresent()) {
            throw new GradleException('Pass the tag version with -PreleaseVersion=<version>')
        }
        if (releaseVersion.get() != project.version.toString()) {
            throw new GradleException("Release version ${releaseVersion.get()} does not match ${project.version}")
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

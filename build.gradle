import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'fabric-loom' version '1.7.4'
}
version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-fabric-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories { mavenCentral() }
configurations { nightConfigSources }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation include('com.electronwill.night-config:core:3.6.4')
    implementation include('com.electronwill.night-config:toml:3.6.4')
    nightConfigSources 'com.electronwill.night-config:core:3.6.4:sources'
    nightConfigSources 'com.electronwill.night-config:toml:3.6.4:sources'
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
loom {
    mixin { defaultRefmapName = "${mod_id}.refmap.json" }
    runs {
        client { client(); runDir 'run/client' }
        server { server(); runDir 'run/server'; programArg '--nogui' }
    }
}
tasks.named('test', Test) { useJUnitPlatform() }
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = ['minecraft_version', 'java_version', 'loader_version', 'fabric_api_version',
                      'mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description']
            .collectEntries { [(it): project.property(it)] }
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.exclude 'native/**'

def wstunnelManifestFile = file('src/main/resources/META-INF/miguelnetwork/wstunnel-manifest.json')
def wstunnelManifest = new JsonSlurper().parse(wstunnelManifestFile)
def wstunnelOutputDirectory = layout.buildDirectory.dir('generated/wstunnelResources')
def wstunnelArchiveOverride = providers.gradleProperty('wstunnelArchiveDir')

def sha256 = { InputStream input ->
    def digest = MessageDigest.getInstance('SHA-256')
    try (input) {
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = input.read(buffer)) >= 0) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

def prepareWstunnel = tasks.register('prepareWstunnel') {
    group = 'build'
    description = 'Downloads, verifies, and stages the pinned upstream wstunnel binaries.'

    inputs.file(wstunnelManifestFile)
    inputs.property('wstunnelVersion', wstunnelManifest.version)
    inputs.property('wstunnelPlatforms', wstunnelManifest.platforms.toString())
    outputs.dir(wstunnelOutputDirectory)

    doLast {
        File outputDirectory = wstunnelOutputDirectory.get().asFile
        delete(outputDirectory)

        File cacheDirectory = new File(
                gradle.gradleUserHomeDir,
                "caches/miguelnetwork/wstunnel/${wstunnelManifest.version}"
        )
        cacheDirectory.mkdirs()

        wstunnelManifest.platforms.each { String platformName, Map metadata ->
            File archiveFile
            if (wstunnelArchiveOverride.isPresent()) {
                archiveFile = new File(wstunnelArchiveOverride.get(), metadata.archive as String)
                if (!archiveFile.isFile()) {
                    throw new GradleException("Missing wstunnel archive in -PwstunnelArchiveDir: ${archiveFile}")
                }
            } else {
                archiveFile = new File(cacheDirectory, metadata.archive as String)
                if (!archiveFile.isFile()
                        || sha256(new FileInputStream(archiveFile)) != metadata.archiveSha256) {
                    File temporaryFile = new File(cacheDirectory, "${metadata.archive}.tmp")
                    temporaryFile.delete()
                    String downloadUrl = "${wstunnelManifest.upstream}/releases/download/v${wstunnelManifest.version}/${metadata.archive}"
                    logger.lifecycle("Downloading ${downloadUrl}")
                    def connection = uri(downloadUrl).toURL().openConnection()
                    connection.connectTimeout = 30_000
                    connection.readTimeout = 120_000
                    try (InputStream input = connection.inputStream) {
                        Files.copy(input, temporaryFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
                    }
                    String temporaryHash = sha256(new FileInputStream(temporaryFile))
                    if (temporaryHash != metadata.archiveSha256) {
                        temporaryFile.delete()
                        throw new GradleException("wstunnel archive SHA-256 mismatch for ${metadata.archive}: "
                                + "expected ${metadata.archiveSha256}, got ${temporaryHash}")
                    }
                    Files.move(temporaryFile.toPath(), archiveFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
            }

            String archiveHash = sha256(new FileInputStream(archiveFile))
            if (archiveHash != metadata.archiveSha256) {
                throw new GradleException("wstunnel archive SHA-256 mismatch for ${metadata.archive}: "
                        + "expected ${metadata.archiveSha256}, got ${archiveHash}")
            }

            String executableName = platformName.startsWith('windows-') ? 'wstunnel.exe' : 'wstunnel'
            Set<File> candidates = tarTree(resources.gzip(archiveFile)).matching {
                include executableName
                include "**/${executableName}"
            }.files
            if (candidates.size() != 1) {
                throw new GradleException("Expected one ${executableName} in ${metadata.archive}, found ${candidates.size()}")
            }

            File executable = candidates.first()
            String executableHash = sha256(new FileInputStream(executable))
            if (executableHash != metadata.binarySha256) {
                throw new GradleException("wstunnel binary SHA-256 mismatch for ${platformName}: "
                        + "expected ${metadata.binarySha256}, got ${executableHash}")
            }

            File target = new File(outputDirectory, "native/${platformName}/${executableName}")
            target.parentFile.mkdirs()
            Files.copy(executable.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn prepareWstunnel

    from(wstunnelOutputDirectory)
    from(configurations.nightConfigSources) { into 'META-INF/sources' }

    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-MiguelNetwork-Apache-2.0.txt' }
    }
    from('NOTICE') {
        into 'META-INF'
        rename { 'NOTICE-MiguelNetwork.txt' }
    }
}


def verifyDistribution = tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Checks the remapped Fabric distribution, natives, dependencies, and notices.'
    dependsOn tasks.named('remapJar')
    doLast {
        File jarFile = tasks.named('remapJar').get().archiveFile.get().asFile
        new ZipFile(jarFile).withCloseable { zip ->
            def required = ['fabric.mod.json', "${mod_id}.mixins.json", "${mod_id}.refmap.json",
                'META-INF/LICENSE-MiguelNetwork-Apache-2.0.txt', 'META-INF/NOTICE-MiguelNetwork.txt',
                'META-INF/licenses/wstunnel-BSD-3-Clause.txt', 'THIRD_PARTY_NOTICES.md',
                'META-INF/miguelnetwork/wstunnel-manifest.json',
                'META-INF/licenses/night-config-LGPL-3.0.txt', 'META-INF/licenses/GPL-3.0.txt',
                'META-INF/sources/core-3.6.4-sources.jar', 'META-INF/sources/toml-3.6.4-sources.jar']
            required.each { if (zip.getEntry(it) == null) throw new GradleException("Missing ${it}") }
            ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml'].each {
                if (zip.getEntry(it) != null) throw new GradleException("Unexpected Loader metadata ${it}")
            }
            def metadata = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            if (metadata.id != mod_id || metadata.version != mod_version || metadata.depends.minecraft != "=${minecraft_version}"
                    || metadata.depends.java != ">=${java_version}") throw new GradleException('Invalid Fabric metadata')
            if (metadata.jars.size() != 2) throw new GradleException('Expected embedded NightConfig core and TOML libraries')
            metadata.jars.each { if (!zip.getEntry(it.file)) throw new GradleException("Missing nested dependency ${it.file}") }
            def mixins = new JsonSlurper().parse(zip.getInputStream(zip.getEntry("${mod_id}.mixins.json")))
            if (mixins.compatibilityLevel != "JAVA_${java_version}" || mixins.refmap != "${mod_id}.refmap.json")
                throw new GradleException('Invalid Mixin configuration')
            def refmap = new JsonSlurper().parse(zip.getInputStream(zip.getEntry("${mod_id}.refmap.json")))
            def mappings = refmap.mappings['io/github/therealkamisama/miguelnetwork/mixin/ConnectionMixin']
            if (!mappings || !mappings.values().any { it.contains('method_') })
                throw new GradleException('ConnectionMixin has no intermediary mapping')
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).bytes
                    def input = new DataInputStream(new ByteArrayInputStream(bytes))
                    input.readInt(); input.readUnsignedShort()
                    if (input.readUnsignedShort() > (java_version as int) + 44)
                        throw new GradleException("Wrong Java bytecode: ${entry.name}")
                    String symbols = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (symbols.contains('net/minecraftforge/') || symbols.contains('net/neoforged/'))
                        throw new GradleException("Unexpected Loader reference: ${entry.name}")
                }
            }
            wstunnelManifest.platforms.each { platform, details ->
                def executable = platform.startsWith('windows-') ? 'wstunnel.exe' : 'wstunnel'
                def entry = zip.getEntry("native/${platform}/${executable}")
                if (entry == null || sha256(zip.getInputStream(entry)) != details.binarySha256)
                    throw new GradleException("Invalid native executable for ${platform}")
            }
        }
    }
}
tasks.named('check') { dependsOn verifyDistribution }
tasks.register('verifyReleaseVersion') {
    doLast {
        if (providers.gradleProperty('releaseVersion').orNull != project.version.toString())
            throw new GradleException('Pass the matching -PreleaseVersion=<version>')
    }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
}

tasks.register('exportSmokeClasspath') {
    group = 'verification'
    description = 'Exports resolved libraries for the isolated production Fabric smoke harness.'
    doLast {
        layout.buildDirectory.file('smoke-runtime-classpath.txt').get().asFile.text =
                configurations.runtimeClasspath.files.collect { it.absolutePath }.join('\n')
    }
}

// Dual-channel distribution policy; preserve the platform's production mapping.
ext.releaseProductionTask = 'remapJar'
ext.releaseProductionFile = tasks.named('remapJar').flatMap { it.archiveFile }
apply from: 'gradle/dual-channel.gradle'

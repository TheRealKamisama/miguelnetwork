name: Fabric release preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --no-daemon
      - run: sha256sum build/libs/miguelnetwork-fabric-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MiguelNetwork-Fabric-1.20.1
          path: build/libs/miguelnetwork-fabric-*.jar
          if-no-files-found: error
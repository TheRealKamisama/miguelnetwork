name: prepare-cleanroom-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build and verify remapped production JAR
        run: ./gradlew build --no-daemon
      - name: Show checksums
        run: sha256sum build/libs/*-cleanroom-1.12.2-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MiguelNetwork-Cleanroom
          path: |
            build/libs/*-cleanroom-1.12.2-*.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

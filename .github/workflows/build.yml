name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiguelNetwork
          path: build/libs/*.jar
          if-no-files-found: error

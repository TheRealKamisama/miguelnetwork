name: build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Show distribution checksums
        run: sha256sum build/libs/*.jar
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiguelNetwork
          path: |
            build/libs/*-cleanroom-1.12.2-*.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

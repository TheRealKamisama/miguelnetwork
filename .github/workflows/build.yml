name: Build Forge 1.7.10
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-forge-1.7.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MiguelNetwork-Forge-1.7.10
          path: |
            platform-forge-1.7.10/build/libs/*.jar
            !platform-forge-1.7.10/build/libs/*-dev*.jar
            !platform-forge-1.7.10/build/libs/*-sources.jar
          if-no-files-found: error
